<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hệ thống luyện trắc nghiệm các môn lý luận chính trị.">
  <title>FPT Political Quiz</title>
  <link rel="stylesheet" href="styles.css">
  <script src="sources.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="quiz-container" aria-label="Hệ thống học trắc nghiệm">
    <button class="nav-btn prev-btn" id="prevBtn" type="button" aria-label="Câu trước">&#10094;</button>

    <section class="left-panel" aria-label="Trả lời câu hỏi">
      <div class="source-container">
        <label class="source-label" for="sourceSelect">Nguồn câu hỏi</label>
        <select id="sourceSelect" class="source-select" aria-label="Chọn nguồn câu hỏi"></select>
      </div>

      <div class="jump-container">
        <span class="question-number-text" id="qNumberDisplay">Câu: 1</span>
        <span>/ <span id="totalQuestionsDisplay">0</span></span>
        <label class="sr-only" for="jumpInput">Đi tới câu</label>
        <input id="jumpInput" class="jump-input" type="number" placeholder="Đi tới" min="1" inputmode="numeric">
      </div>

      <p class="instruction-text" id="instructionDisplay">(Chọn 1 đáp án)</p>
      <div class="answer-section" id="dynamicAnswers" aria-label="Các đáp án"></div>

      <section id="resultBox" class="result-container" aria-live="polite" hidden>
        <div id="resultStatus" class="result-status"></div>
        <div id="correctAnswerDisplay" class="result-answer"></div>
        <div id="explanationDisplay" class="explanation"></div>
      </section>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="right-panel" aria-label="Nội dung câu hỏi">
      <div class="question-content-text" id="qContentDisplay"></div>
      <div class="options-container" id="dynamicOptions"></div>
    </section>

    <button class="nav-btn next-btn" id="nextBtn" type="button" aria-label="Câu sau">&#10095;</button>
  </main>
</body>
</html>
