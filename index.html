<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Hệ thống luyện trắc nghiệm các môn lý luận chính trị.">
  <title>FPT Political Final Exam</title>
  <link rel="stylesheet" href="styles.css?v=0a303378e4d6">
  <script src="sources.js?v=54a9c20ea557" defer></script>
  <script src="app.js?v=77f4fbd0d061" type="module"></script>
</head>
<body>
  <main id="quizContainer" class="quiz-container" aria-label="FPT Political Final Exam">
    <div class="progress-track" aria-label="Tiến độ làm bài">
      <div id="progressBar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <button class="nav-btn prev-btn" id="prevBtn" type="button" aria-label="Câu trước">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" aria-hidden="true"><path d="m14.5 4-8 8 8 8" /></svg>
    </button>

    <section class="left-panel" aria-label="Trả lời câu hỏi">
      <div class="source-container">
        <label class="source-label" for="sourceSelect">Nguồn câu hỏi</label>
        <select id="sourceSelect" class="source-select" aria-label="Chọn nguồn câu hỏi"></select>
      </div>

      <div class="exam-actions" aria-label="Chế độ thi">
        <button id="startExamBtn" class="exam-btn" type="button">Thi thử (60 câu)</button>
        <button id="submitExamBtn" class="exam-btn exam-btn-submit" type="button" hidden>Nộp bài</button>
        <button id="exitExamBtn" class="exam-btn exam-btn-exit" type="button" hidden>Thoát chế độ thi</button>
      </div>

      <details class="practice-options-menu">
        <summary>Tùy chọn</summary>
        <div class="practice-options-list">
          <button id="shuffleOptionsBtn" class="shuffle-options-btn" type="button" aria-pressed="false">Đảo lựa chọn: Tắt</button>
          <button id="reshuffleOptionsBtn" class="shuffle-options-btn" type="button" hidden>Đảo lại lựa chọn</button>
          <button id="retryIncorrectBtn" class="practice-btn practice-only" type="button">Làm lại câu sai</button>
          <button id="resetSourceBtn" class="practice-btn practice-btn-danger practice-only" type="button">Làm lại toàn bộ</button>
        </div>
      </details>

      <div class="practice-actions" aria-label="Tùy chọn luyện tập">
        <button id="showAllBtn" class="practice-btn practice-btn-secondary" type="button" hidden>Quay lại tất cả câu</button>
      </div>
      <p id="practiceModeDisplay" class="practice-mode" hidden></p>

      <div class="jump-container">
        <span class="question-number-text" id="qNumberDisplay">Câu: 1</span>
        <span>/ <span id="totalQuestionsDisplay">0</span></span>
        <label class="sr-only" for="jumpInput">Đi tới câu</label>
        <input id="jumpInput" class="jump-input" type="number" placeholder="Đi tới" min="1" inputmode="numeric">
      </div>

      <p class="instruction-text" id="instructionDisplay">(Chọn 1 đáp án)</p>
      <div class="answer-section" id="dynamicAnswers" aria-label="Các đáp án"></div>

      <button class="nav-btn next-btn" id="nextBtn" type="button" aria-label="Câu sau">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" aria-hidden="true"><path d="m14.5 4-8 8 8 8" /></svg>
      </button>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="right-panel" aria-label="Nội dung câu hỏi">
      <div id="examTimerControls" class="exam-timer-controls" hidden>
        <div>
          <p id="examTimer" class="exam-timer" role="timer" aria-live="polite"></p>
          <p class="timer-joke">15p là quá nhiều với sinh viên FPT.</p>
        </div>
        <button id="disableExamTimerBtn" class="disable-timer-btn" type="button">Ơ sao lại tắt</button>
      </div>
      <div class="question-content-text" id="qContentDisplay"></div>
      <div class="options-container" id="dynamicOptions"></div>
      <section id="resultBox" class="result-container" aria-live="polite" hidden>
        <div id="resultStatus" class="result-status"></div>
        <div id="correctAnswerDisplay" class="result-answer"></div>
        <div id="explanationDisplay" class="explanation"></div>
      </section>
    </section>

  </main>

  <div id="examResultModal" class="modal-backdrop" hidden>
    <section class="exam-modal" role="dialog" aria-modal="true" aria-labelledby="examModalTitle" aria-describedby="examModalSummary">
      <div class="exam-modal-icon" aria-hidden="true">✓</div>
      <h2 id="examModalTitle" class="exam-modal-title">Kết quả bài thi</h2>
      <p id="examModalScore" class="exam-modal-score"></p>
      <p id="examModalSummary" class="exam-modal-summary"></p>
      <p id="examModalMessage" class="exam-modal-message"></p>
      <div class="exam-modal-actions">
        <button id="retryExamBtn" class="exam-btn exam-btn-retry" type="button">Làm lại câu sai</button>
        <button id="retakeExamBtn" class="exam-btn exam-btn-retake" type="button">Thi lại đề này</button>
        <button id="newExamBtn" class="exam-btn exam-btn-new" type="button">Thi đề khác</button>
        <button id="exitExamModalBtn" class="exam-btn exam-btn-exit" type="button">Thoát chế độ thi</button>
      </div>
    </section>
  </div>

  <div id="examConfirmModal" class="modal-backdrop" hidden>
    <section class="exam-modal exam-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="examConfirmTitle" aria-describedby="examConfirmMessage">
      <h2 id="examConfirmTitle" class="exam-modal-title">Xác nhận</h2>
      <p id="examConfirmMessage" class="exam-modal-message"></p>
      <div class="exam-modal-actions">
        <button id="cancelExamConfirmBtn" class="exam-btn exam-btn-retake" type="button">Quay lại làm bài</button>
        <button id="acceptExamConfirmBtn" class="exam-btn exam-btn-submit" type="button">Xác nhận</button>
      </div>
    </section>
  </div>
</body>
</html>
