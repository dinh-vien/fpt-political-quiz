<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Trắc Nghiệm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: white;
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            min-height: 600px;
            display: flex;
            border: 2px solid #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .left-panel {
            width: 35%;
            padding: 20px 20px 20px 60px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .divider {
            width: 2px;
            background-color: red;
            height: 100%;
            flex-shrink: 0;
        }

        .right-panel {
            width: 65%;
            padding: 20px 60px 20px 40px;
            position: relative;
            overflow-y: auto;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 3rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 10;
        }

        .nav-btn:hover {
            color: #888;
        }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }

        .nav-btn:disabled {
            color: #eee;
            cursor: not-allowed;
        }
        
        .jump-container {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .jump-input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .question-number-text {
            font-size: 14px;
            font-weight: bold;
        }

        .instruction-text {
            font-size: 14px;
            margin-bottom: 30px;
            color: #555;
        }

        .question-content-text {
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: bold;
        }

        .option-text {
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
            display: flex;
        }

        .option-letter {
            margin-right: 10px;
            font-weight: bold;
        }

        .answer-section {
            margin-top: 20px;
        }

        .answer-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .answer-row input[type="radio"],
        .answer-row input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .answer-label {
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .result-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .result-correct {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #34d399;
            display: block;
        }

        .result-incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
            display: block;
        }

        .explanation {
            margin-top: 10px;
            font-size: 14px;
            font-style: italic;
        }

        .source-container {
            margin-bottom: 15px;
        }

        .source-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .source-select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            font-size: 14px;
        }

        .source-error {
            padding: 16px;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #f87171;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="quiz-container">
        <button class="nav-btn prev-btn" id="prevBtn" onclick="prevQuestion()"
            aria-label="Previous question">&#10094;</button>

        <!-- Panel Trái -->
        <div class="left-panel">
            <div class="source-container">
                <label class="source-label" for="sourceSelect">Nguồn câu hỏi</label>
                <select id="sourceSelect" class="source-select" aria-label="Chọn nguồn câu hỏi"></select>
            </div>
            <div class="jump-container">
                <span class="question-number-text" id="qNumberDisplay">Question: 1</span>
                <span>/ <span id="totalQuestionsDisplay"></span></span>
                <input type="number" id="jumpInput" class="jump-input" placeholder="Go..." min="1">
            </div>
            <div class="instruction-text" id="instructionDisplay">(Choose 1 answer)</div>

            <div class="answer-section" id="dynamicAnswers">
                <!-- Radio buttons/Checkboxes render here -->
            </div>

            <div id="resultBox" class="result-container">
                <div id="resultStatus" class="font-bold mb-1"></div>
                <div id="correctAnswerDisplay" class="text-sm"></div>
                <div id="explanationDisplay" class="explanation"></div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Panel Phải -->
        <div class="right-panel">
            <div class="question-content-text" id="qContentDisplay"></div>
            <div class="options-container" id="dynamicOptions">
                <!-- Options render here -->
            </div>
        </div>

        <button class="nav-btn next-btn" id="nextBtn" onclick="nextQuestion()"
            aria-label="Next question">&#10095;</button>
    </div>

    <script src="sources.js"></script>
    <script>
        window.quizSources = window.quizSources || {};

        let activeSourceId = localStorage.getItem('quiz_activeSource') || '';
        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};

        const qNumberDisplay = document.getElementById('qNumberDisplay');
        const totalQuestionsDisplay = document.getElementById('totalQuestionsDisplay');
        const instructionDisplay = document.getElementById('instructionDisplay');
        const qContentDisplay = document.getElementById('qContentDisplay');
        const dynamicAnswers = document.getElementById('dynamicAnswers');
        const dynamicOptions = document.getElementById('dynamicOptions');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const jumpInput = document.getElementById('jumpInput');
        const sourceSelect = document.getElementById('sourceSelect');
        const resultBox = document.getElementById('resultBox');
        const resultStatus = document.getElementById('resultStatus');
        const correctAnswerDisplay = document.getElementById('correctAnswerDisplay');
        const explanationDisplay = document.getElementById('explanationDisplay');

        function sourceStateKey(type) {
            return `quiz_${activeSourceId}_${type}`;
        }

        function saveState() {
            if (!activeSourceId) return;
            localStorage.setItem('quiz_activeSource', activeSourceId);
            localStorage.setItem(sourceStateKey('currentIndex'), currentIndex);
            localStorage.setItem(sourceStateKey('userAnswers'), JSON.stringify(userAnswers));
        }

        function loadScript(file) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = file;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Không tải được file ${file}`));
                document.head.appendChild(script);
            });
        }

        async function loadAllSources() {
            const files = Array.isArray(window.quizSourceFiles) ? window.quizSourceFiles : [];
            await Promise.all(files.map(loadScript));
        }

        function normalizeOptions(options) {
            if (Array.isArray(options)) {
                return Object.fromEntries(options
                    .map((option, index) => [String.fromCharCode(65 + index), option])
                    .filter(([, option]) => String(option || '').trim()));
            }
            return Object.fromEntries(Object.entries(options || {})
                .filter(([, option]) => String(option || '').trim()));
        }

        function mapQuestions(source) {
            return source.questions.map((q, i) => ({
                id: i + 1,
                text: q.question,
                options: normalizeOptions(q.options),
                correctAnswer: String(q.answer || '').toUpperCase(),
                explanation: q.explanation || ''
            })).filter(q => q.text && q.correctAnswer && q.options && Object.keys(q.options).length >= 2);
        }

        function populateSourceSelect() {
            const entries = Object.entries(window.quizSources);
            sourceSelect.innerHTML = '';

            for (const [id, source] of entries) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = `${source.name} (${source.questions.length} câu)`;
                sourceSelect.appendChild(option);
            }

            if (!entries.length) {
                throw new Error('Không tìm thấy nguồn câu hỏi nào. Kiểm tra sources.js và các file nguồn.');
            }

            if (!window.quizSources[activeSourceId]) {
                activeSourceId = entries[0][0];
            }
            sourceSelect.value = activeSourceId;
        }

        function switchSource(sourceId) {
            const source = window.quizSources[sourceId];
            if (!source) return;

            activeSourceId = sourceId;
            questionsData = mapQuestions(source);
            currentIndex = parseInt(localStorage.getItem(sourceStateKey('currentIndex')), 10) || 0;
            userAnswers = JSON.parse(localStorage.getItem(sourceStateKey('userAnswers')) || '{}');

            if (currentIndex < 0 || currentIndex >= questionsData.length) currentIndex = 0;
            totalQuestionsDisplay.textContent = questionsData.length;

            if (!questionsData.length) {
                qContentDisplay.innerHTML = '<div class="source-error">Nguồn này không có câu hỏi hợp lệ.</div>';
                dynamicAnswers.innerHTML = '';
                dynamicOptions.innerHTML = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            loadQuestion(currentIndex);
            updateNavButtons();
            saveState();
        }

        async function initQuiz() {
            try {
                await loadAllSources();
                populateSourceSelect();
                switchSource(activeSourceId);

                sourceSelect.addEventListener('change', function () {
                    switchSource(this.value);
                });

                jumpInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        const val = parseInt(this.value, 10);
                        if (val >= 1 && val <= questionsData.length) {
                            currentIndex = val - 1;
                            loadQuestion(currentIndex);
                            updateNavButtons();
                            saveState();
                            this.blur();
                        } else {
                            alert('Số câu không hợp lệ.');
                        }
                    }
                });

                document.addEventListener('keydown', function (e) {
                    if (document.activeElement === jumpInput || document.activeElement === sourceSelect) return;
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        prevQuestion();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        nextQuestion();
                    } else if (e.code === 'Space') {
                        e.preventDefault();
                        showAnswerImmediately();
                    }
                });
            } catch (error) {
                qContentDisplay.innerHTML = `<div class="source-error">${error.message}</div>`;
                console.error(error);
            }
        }

        function loadQuestion(index) {
            const q = questionsData[index];
            qNumberDisplay.textContent = `Question: ${index + 1}`;
            jumpInput.value = index + 1;
            qContentDisplay.textContent = q.text;

            const numAnswersRequired = q.correctAnswer.length;
            instructionDisplay.textContent = `(Choose ${numAnswersRequired} answer${numAnswersRequired > 1 ? 's' : ''})`;
            const inputType = numAnswersRequired > 1 ? 'checkbox' : 'radio';

            let leftHTML = '<p class="font-semibold mb-2 text-sm">Select your answer:</p>';
            let rightHTML = '';

            for (const key in q.options) {
                leftHTML += `
                    <label class="answer-row">
                        <input type="${inputType}" name="userAnswer" value="${key}" onchange="checkAnswer()">
                        <span class="answer-label">${key}</span>
                    </label>`;
                rightHTML += `
                    <div class="option-text">
                        <span class="option-letter">${key}.</span>
                        <span>${q.options[key]}</span>
                    </div>`;
            }

            dynamicAnswers.innerHTML = leftHTML;
            dynamicOptions.innerHTML = rightHTML;
            resultBox.className = 'result-container';
            resultBox.style.display = 'none';

            const saved = userAnswers[currentIndex] || '';
            if (saved) {
                for (const input of document.getElementsByName('userAnswer')) {
                    input.checked = saved.includes(input.value);
                }
                showResult(saved, q);
            }
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === questionsData.length - 1;
        }

        function checkAnswer() {
            const selected = [...document.getElementsByName('userAnswer')]
                .filter(input => input.checked)
                .map(input => input.value)
                .sort();

            const selectedStr = selected.join('');
            userAnswers[currentIndex] = selectedStr;
            saveState();

            const currentQ = questionsData[currentIndex];
            if (selected.length >= currentQ.correctAnswer.length) {
                showResult(selectedStr, currentQ);
            } else {
                resultBox.style.display = 'none';
            }
        }

        function showAnswerImmediately() {
            if (!questionsData.length) return;
            const currentQ = questionsData[currentIndex];
            userAnswers[currentIndex] = currentQ.correctAnswer.split('').sort().join('');
            saveState();

            for (const input of document.getElementsByName('userAnswer')) {
                input.checked = currentQ.correctAnswer.includes(input.value);
            }
            showResult(userAnswers[currentIndex], currentQ);
        }

        function showResult(userAnsStr, questionObj) {
            const correctSorted = questionObj.correctAnswer.split('').sort().join('').toUpperCase();
            const userSorted = userAnsStr.toUpperCase();
            const isCorrect = userSorted === correctSorted;

            resultBox.style.display = 'block';
            resultBox.className = `result-container ${isCorrect ? 'result-correct' : 'result-incorrect'}`;
            resultStatus.textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect';
            correctAnswerDisplay.innerHTML = `Correct answer is: <strong>${questionObj.correctAnswer}</strong>`;
            explanationDisplay.textContent = questionObj.explanation || '';
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion(currentIndex);
                updateNavButtons();
                saveState();
            }
        }

        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
                updateNavButtons();
                saveState();
            }
        }

        window.onload = initQuiz;
    </script>
</body>

</html>
