<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Hệ thống ôn tập và thi thử trắc nghiệm các môn Lý luận chính trị.">
  <title>Ôn tập trắc nghiệm Lý luận chính trị</title>
  <link rel="stylesheet" href="styles.css?v=c597a8c64cdb">
  <script src="sources.js?v=079cac542f6b" defer></script>
  <script src="app.js?v=6433907d820c" type="module"></script>
</head>
<body>
  <main id="quizContainer" class="quiz-container" aria-label="Hệ thống ôn tập trắc nghiệm Lý luận chính trị">
    <div class="progress-track" aria-label="Tiến độ làm bài">
      <div id="progressBar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <button class="nav-btn prev-btn" id="prevBtn" type="button" aria-label="Câu trước">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" aria-hidden="true"><path d="m14.5 4-8 8 8 8" /></svg>
    </button>

    <section class="left-panel" aria-label="Trả lời câu hỏi">
      <div class="source-container">
        <label class="source-label" for="sourceSelect">Nguồn câu hỏi</label>
        <select id="sourceSelect" class="source-select" aria-label="Chọn nguồn câu hỏi"></select>
      </div>

      <div class="exam-actions" aria-label="Chế độ thi">
        <label id="examCountControl" class="exam-count-control" for="examCountInput">
          Số câu hỏi
          <input id="examCountInput" type="number" min="1" step="1" value="60" inputmode="numeric" aria-label="Số câu hỏi của bài thi thử">
        </label>
        <label id="examRangeControl" class="exam-count-control" for="examFromInput">
          Từ câu
          <input id="examFromInput" type="number" min="1" step="1" inputmode="numeric" aria-label="Từ câu số">
          đến
          <input id="examToInput" type="number" min="1" step="1" inputmode="numeric" aria-label="Đến câu số">
        </label>
        <button id="startExamBtn" class="exam-btn" type="button">Bắt đầu làm bài</button>
        <button id="submitExamBtn" class="exam-btn exam-btn-submit" type="button" hidden>Nộp bài</button>
        <button id="exitExamBtn" class="exam-btn exam-btn-exit" type="button" hidden>Kết thúc bài thi</button>
      </div>

      <div id="rushControls" class="rush-actions" aria-label="Chế độ học cấp tốc">
        <label id="rushBlockControl" class="exam-count-control" for="rushBlockSelect">
          Khối
          <select id="rushBlockSelect" class="rush-block-select" aria-label="Chọn khối câu hỏi"></select>
        </label>
        <button id="startRushBtn" class="exam-btn" type="button">Học cấp tốc</button>
        <button id="exitRushBtn" class="exam-btn exam-btn-exit" type="button" hidden>Tạm dừng học cấp tốc</button>
      </div>
      <p id="rushStatus" class="rush-status" hidden></p>

      <details class="practice-options-menu">
        <summary>Tùy chọn</summary>
        <div class="practice-options-list">
          <button id="shuffleOptionsBtn" class="shuffle-options-btn" type="button" aria-pressed="false">Đảo thứ tự đáp án: Tắt</button>
          <button id="reshuffleOptionsBtn" class="shuffle-options-btn" type="button" hidden>Đảo lại thứ tự đáp án</button>
          <button id="retryIncorrectBtn" class="practice-btn practice-only" type="button">Làm lại câu sai</button>
          <button id="resetSourceBtn" class="practice-btn practice-btn-danger practice-only" type="button">Đặt lại toàn bộ tiến độ</button>
          <button id="resetRushBtn" class="practice-btn practice-btn-danger practice-only" type="button">Đặt lại tiến độ học cấp tốc</button>
        </div>
      </details>

      <div class="practice-actions" aria-label="Tùy chọn luyện tập">
        <button id="showAllBtn" class="practice-btn practice-btn-secondary" type="button" hidden>Quay lại toàn bộ câu hỏi</button>
      </div>
      <p id="practiceModeDisplay" class="practice-mode" hidden></p>

      <div class="jump-container">
        <span class="question-number-text" id="qNumberDisplay">Câu: 1</span>
        <span>/ <span id="totalQuestionsDisplay">0</span></span>
        <label class="sr-only" for="jumpInput">Đi tới câu</label>
        <input id="jumpInput" class="jump-input" type="number" placeholder="Đến câu" min="1" inputmode="numeric">
      </div>

      <details class="question-map" id="questionMapPanel" open>
        <summary>Danh sách câu hỏi</summary>
        <div class="question-map-grid" id="questionMap" role="group" aria-label="Danh sách câu hỏi"></div>
        <ul class="question-map-legend" aria-label="Chú thích">
          <li><span class="legend-swatch is-current"></span>Đang xem</li>
          <li><span class="legend-swatch is-answered"></span>Đã trả lời</li>
          <li><span class="legend-swatch is-correct"></span>Đúng</li>
          <li><span class="legend-swatch is-incorrect"></span>Sai</li>
        </ul>
      </details>

      <p class="instruction-text" id="instructionDisplay">(Chọn 1 đáp án đúng)</p>
      <div class="answer-section" id="dynamicAnswers" aria-label="Các đáp án"></div>

      <button class="nav-btn next-btn" id="nextBtn" type="button" aria-label="Câu sau">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" aria-hidden="true"><path d="m14.5 4-8 8 8 8" /></svg>
      </button>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="right-panel" aria-label="Nội dung câu hỏi">
      <div class="question-content-text" id="qContentDisplay"></div>
      <div class="options-container" id="dynamicOptions"></div>
      <section id="resultBox" class="result-container" aria-live="polite" hidden>
        <div id="resultStatus" class="result-status"></div>
        <div id="correctAnswerDisplay" class="result-answer"></div>
        <div id="explanationDisplay" class="explanation"></div>
        <button id="rushContinueBtn" class="exam-btn rush-continue-btn" type="button" hidden>Tiếp tục</button>
      </section>
    </section>

  </main>

  <div id="examResultModal" class="modal-backdrop" hidden>
    <section class="exam-modal" role="dialog" aria-modal="true" aria-labelledby="examModalTitle" aria-describedby="examModalSummary">
      <div class="exam-modal-icon" aria-hidden="true">✓</div>
      <h2 id="examModalTitle" class="exam-modal-title">Kết quả bài thi</h2>
      <p id="examModalScore" class="exam-modal-score"></p>
      <p id="examModalSummary" class="exam-modal-summary"></p>
      <p id="examModalMessage" class="exam-modal-message"></p>
      <div class="exam-modal-actions">
        <button id="retryExamBtn" class="exam-btn exam-btn-retry" type="button">Làm lại câu sai</button>
        <button id="retakeExamBtn" class="exam-btn exam-btn-retake" type="button">Làm lại đề này</button>
        <button id="newExamBtn" class="exam-btn exam-btn-new" type="button">Làm đề mới</button>
        <button id="exitExamModalBtn" class="exam-btn exam-btn-exit" type="button">Kết thúc bài thi</button>
      </div>
    </section>
  </div>

  <div id="examConfirmModal" class="modal-backdrop" hidden>
    <section class="exam-modal exam-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="examConfirmTitle" aria-describedby="examConfirmMessage">
      <h2 id="examConfirmTitle" class="exam-modal-title">Xác nhận</h2>
      <p id="examConfirmMessage" class="exam-modal-message"></p>
      <div class="exam-modal-actions">
        <button id="cancelExamConfirmBtn" class="exam-btn exam-btn-retake" type="button">Quay lại làm bài</button>
        <button id="acceptExamConfirmBtn" class="exam-btn exam-btn-submit" type="button">Xác nhận</button>
      </div>
    </section>
  </div>
</body>
</html>
